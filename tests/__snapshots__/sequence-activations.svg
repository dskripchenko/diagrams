<svg xmlns="http://www.w3.org/2000/svg" id="dg-idlxsn" class="dg dg-sequence" width="546" height="600" viewBox="0 0 546 600" role="img" aria-labelledby="dg-idlxsn-title" style="max-width:100%;height:auto"><title id="dg-idlxsn-title">Sequence diagram</title><style>#dg-idlxsn{font-family:var(--dg-font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);font-size:14px;color:var(--dg-text, #1f2937)}#dg-idlxsn text{fill:var(--dg-text, #1f2937)}#dg-idlxsn .dg-label{fill:var(--dg-node-text, #1e1b4b)}#dg-idlxsn .dg-node .dg-shape{fill:var(--dg-node-fill, #eef2ff);stroke:var(--dg-node-stroke, #6366f1);stroke-width:1.5px}#dg-idlxsn .dg-cluster-box{fill:var(--dg-cluster-fill, #f8fafc);stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-idlxsn .dg-cluster-label{fill:var(--dg-cluster-text, #334155);font-weight:600}#dg-idlxsn .dg-edge{fill:none;stroke:var(--dg-line, #64748b);stroke-width:1.5px}#dg-idlxsn .dg-edge-thick{stroke-width:3.5px}#dg-idlxsn .dg-edge-dotted{stroke-dasharray:3 3}#dg-idlxsn .dg-marker{fill:var(--dg-line, #64748b);stroke:var(--dg-line, #64748b)}#dg-idlxsn .dg-edge-label-box{fill:var(--dg-edge-label-fill, #ffffff);opacity:0.9}#dg-idlxsn .dg-edge-label{fill:var(--dg-text, #1f2937)}#dg-idlxsn .dg-muted{fill:var(--dg-text-muted, #6b7280)}#dg-idlxsn a{cursor:pointer}#dg-idlxsn .dg-title{fill:var(--dg-text, #1f2937);font-size:18px;font-weight:bold}#dg-idlxsn .dg-actor-box{fill:var(--dg-actor-fill, #eef2ff);stroke:var(--dg-actor-stroke, #6366f1);stroke-width:1.5px}#dg-idlxsn .dg-actor-figure{fill:var(--dg-actor-fill, #eef2ff);stroke:var(--dg-actor-stroke, #6366f1);stroke-width:1.5px}#dg-idlxsn .dg-actor-limbs{fill:none}#dg-idlxsn .dg-actor-label{fill:var(--dg-text, #1f2937)}#dg-idlxsn .dg-lifeline{stroke:var(--dg-lifeline, #94a3b8);stroke-width:1px;stroke-dasharray:4 3}#dg-idlxsn .dg-activation{fill:var(--dg-activation-fill, #e0e7ff);stroke:var(--dg-actor-stroke, #6366f1);stroke-width:1px}#dg-idlxsn .dg-message{fill:none;stroke:var(--dg-line, #64748b);stroke-width:1.5px}#dg-idlxsn .dg-message-dotted{stroke-dasharray:4 3}#dg-idlxsn .dg-message-text{fill:var(--dg-text, #1f2937)}#dg-idlxsn .dg-number{fill:var(--dg-line, #64748b)}#dg-idlxsn .dg-number-text{fill:var(--dg-number-text, #ffffff);font-size:11px;font-weight:bold}#dg-idlxsn .dg-note{fill:var(--dg-note-fill, #fef9c3);stroke:var(--dg-note-stroke, #ca8a04);stroke-width:1px}#dg-idlxsn .dg-note-text{fill:var(--dg-note-text, #422006)}#dg-idlxsn .dg-block{fill:none;stroke:var(--dg-block-stroke, #94a3b8);stroke-width:1.5px}#dg-idlxsn .dg-block-tab{fill:var(--dg-block-label-fill, #e2e8f0);stroke:var(--dg-block-stroke, #94a3b8);stroke-width:1px}#dg-idlxsn .dg-block-label{fill:var(--dg-text, #1f2937);font-size:13px;font-weight:bold}#dg-idlxsn .dg-block-guard{fill:var(--dg-text-muted, #6b7280);font-size:13px}#dg-idlxsn .dg-block-sep{stroke:var(--dg-block-stroke, #94a3b8);stroke-width:1px;stroke-dasharray:4 3}#dg-idlxsn .dg-rect{fill:var(--dg-rect-fill, rgba(148, 163, 184, 0.12))}#dg-idlxsn .dg-group-box{fill:none;stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-idlxsn .dg-group-label{fill:var(--dg-cluster-text, #334155);font-weight:600}#dg-idlxsn .dg-destroy{fill:none;stroke:var(--dg-line, #64748b);stroke-width:2px}</style><defs><marker id="dg-idlxsn-m-arrow" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" stroke-width="1"/></marker><marker id="dg-idlxsn-m-arrow-start" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" transform="translate(10,0) scale(-1,1)" stroke-width="1"/></marker><marker id="dg-idlxsn-m-open-arrow" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker dg-marker-open" d="M1,1 L9,5 L1,9" style="fill:none" stroke-width="1.5"/></marker><marker id="dg-idlxsn-m-open-arrow-start" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker dg-marker-open" d="M1,1 L9,5 L1,9" transform="translate(10,0) scale(-1,1)" style="fill:none" stroke-width="1.5"/></marker></defs><g transform="translate(8,8)"><g transform="translate(48.18,0)"><g class="dg-groups"/><g class="dg-rects"/><g class="dg-lifelines"><line class="dg-lifeline" x1="45" y1="40" x2="45" y2="543.5"/><line class="dg-lifeline" x1="260.44" y1="40" x2="260.44" y2="543.5"/><line class="dg-lifeline" x1="415.92" y1="40" x2="415.92" y2="543.5"/></g><g class="dg-frames"/><g class="dg-activations"><rect class="dg-activation" x="261.44" y="115" width="10" height="37.5"/><rect class="dg-activation" x="255.44" y="77.5" width="10" height="112.5"/><rect class="dg-activation" x="40" y="265" width="10" height="151.5"/></g><g class="dg-frame-label-layer"/><g class="dg-messages"><g class="dg-message-group"><line class="dg-message" x1="45" y1="77.5" x2="255.44" y2="77.5" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="150.22" y="64.75" dominant-baseline="central">Hello John, how are you?</tspan></text><circle class="dg-number" cx="45" cy="77.5" r="9"/><text class="dg-number-text" x="45" y="77.5" text-anchor="middle" dominant-baseline="central">1</text></g><g class="dg-message-group"><line class="dg-message" x1="45" y1="115" x2="261.44" y2="115" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="153.22" y="102.25" dominant-baseline="central">John, can you hear me?</tspan></text><circle class="dg-number" cx="45" cy="115" r="9"/><text class="dg-number-text" x="45" y="115" text-anchor="middle" dominant-baseline="central">2</text></g><g class="dg-message-group"><line class="dg-message dg-message-dotted" x1="261.44" y1="152.5" x2="45" y2="152.5" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="153.22" y="139.75" dominant-baseline="central">Hi Alice, I can hear you!</tspan></text><circle class="dg-number" cx="261.44" cy="152.5" r="9"/><text class="dg-number-text" x="261.44" y="152.5" text-anchor="middle" dominant-baseline="central">3</text></g><g class="dg-message-group"><line class="dg-message dg-message-dotted" x1="255.44" y1="190" x2="45" y2="190" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="150.22" y="177.25" dominant-baseline="central">I feel great!</tspan></text><circle class="dg-number" cx="255.44" cy="190" r="9"/><text class="dg-number-text" x="255.44" y="190" text-anchor="middle" dominant-baseline="central">4</text></g><g class="dg-message-group"><line class="dg-message" x1="50" y1="296.5" x2="415.92" y2="296.5" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="232.96" y="283.75" dominant-baseline="central">Привет, Боб</tspan></text><circle class="dg-number" cx="50" cy="296.5" r="9"/><text class="dg-number-text" x="50" y="296.5" text-anchor="middle" dominant-baseline="central">5</text></g><g class="dg-message-group"><line class="dg-message dg-message-dotted" x1="415.92" y1="416.5" x2="50" y2="416.5" marker-end="url(#dg-idlxsn-m-open-arrow)"/><text class="dg-message-text" text-anchor="middle" dominant-baseline="central"><tspan x="232.96" y="403.75" dominant-baseline="central">ok</tspan></text><circle class="dg-number" cx="415.92" cy="416.5" r="9"/><text class="dg-number-text" x="415.92" y="416.5" text-anchor="middle" dominant-baseline="central">6</text></g><g class="dg-message-group"><path class="dg-message" d="M415.92,501.5 L449.92,501.5 L449.92,521.5 L415.92,521.5" marker-end="url(#dg-idlxsn-m-arrow)"/><text class="dg-message-text" text-anchor="start" dominant-baseline="central"><tspan x="431.92" y="488.75" dominant-baseline="central">self call</tspan></text><circle class="dg-number" cx="415.92" cy="501.5" r="9"/><text class="dg-number-text" x="415.92" y="501.5" text-anchor="middle" dominant-baseline="central">7</text></g></g><g class="dg-notes"><g class="dg-note-group"><rect class="dg-note" x="272.44" y="206" width="131.48" height="51" rx="2"/><text class="dg-note-text" text-anchor="middle" dominant-baseline="central"><tspan x="338.18" y="222.75" dominant-baseline="central">Rational thoughts</tspan><tspan x="338.18" y="240.25" dominant-baseline="central">prevail!</tspan></text></g><g class="dg-note-group"><rect class="dg-note" x="29" y="312.5" width="402.92" height="68.5" rx="2"/><text class="dg-note-text" text-anchor="middle" dominant-baseline="central"><tspan x="230.46" y="329.25" dominant-baseline="central">A typical interaction that goes on for</tspan><tspan x="230.46" y="346.75" dominant-baseline="central">a long while and needs to wrap</tspan><tspan x="230.46" y="364.25" dominant-baseline="central">because it is very long</tspan></text></g><g class="dg-note-group"><rect class="dg-note" x="-48.18" y="432.5" width="81.18" height="33.5" rx="2"/><text class="dg-note-text" text-anchor="middle" dominant-baseline="central"><tspan x="-7.59" y="449.25" dominant-baseline="central">on the left</tspan></text></g></g><g class="dg-crosses"/><g class="dg-actors"><g class="dg-actor"><rect class="dg-actor-box" x="0" y="0" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="45" y="20" dominant-baseline="central">Alice</tspan></text></g><g class="dg-actor"><rect class="dg-actor-box" x="215.44" y="0" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="260.44" y="20" dominant-baseline="central">John</tspan></text></g><g class="dg-actor"><rect class="dg-actor-box" x="370.92" y="0" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="415.92" y="20" dominant-baseline="central">Bob</tspan></text></g><g class="dg-actor"><rect class="dg-actor-box" x="0" y="543.5" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="45" y="563.5" dominant-baseline="central">Alice</tspan></text></g><g class="dg-actor"><rect class="dg-actor-box" x="215.44" y="543.5" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="260.44" y="563.5" dominant-baseline="central">John</tspan></text></g><g class="dg-actor"><rect class="dg-actor-box" x="370.92" y="543.5" width="90" height="40" rx="4" ry="4"/><text class="dg-actor-label" text-anchor="middle" dominant-baseline="central"><tspan x="415.92" y="563.5" dominant-baseline="central">Bob</tspan></text></g></g></g></g></svg>