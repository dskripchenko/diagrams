<svg xmlns="http://www.w3.org/2000/svg" id="dg-koaqen" class="dg dg-flowchart" width="500" height="377" viewBox="0 0 500 377" role="img" aria-labelledby="dg-koaqen-title" style="max-width:100%;height:auto"><title id="dg-koaqen-title">Flowchart</title><style>#dg-koaqen{font-family:var(--dg-font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);font-size:14px;color:var(--dg-text, #1f2937)}#dg-koaqen text{fill:var(--dg-text, #1f2937)}#dg-koaqen .dg-label{fill:var(--dg-node-text, #1e1b4b)}#dg-koaqen .dg-node .dg-shape{fill:var(--dg-node-fill, #eef2ff);stroke:var(--dg-node-stroke, #6366f1);stroke-width:1.5px}#dg-koaqen .dg-cluster-box{fill:var(--dg-cluster-fill, #f8fafc);stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-koaqen .dg-cluster-label{fill:var(--dg-cluster-text, #334155);font-weight:600}#dg-koaqen .dg-cluster-title .dg-cluster-label{stroke:var(--dg-cluster-fill, #f8fafc);stroke-width:4px;stroke-linejoin:round;paint-order:stroke}#dg-koaqen .dg-edge{fill:none;stroke:var(--dg-line, #64748b);stroke-width:1.5px}#dg-koaqen .dg-edge-thick{stroke-width:3.5px}#dg-koaqen .dg-edge-dotted{stroke-dasharray:3 3}#dg-koaqen .dg-marker{fill:var(--dg-line, #64748b);stroke:var(--dg-line, #64748b)}#dg-koaqen .dg-edge-label-box{fill:var(--dg-edge-label-fill, #ffffff);opacity:0.9}#dg-koaqen .dg-edge-label{fill:var(--dg-text, #1f2937)}#dg-koaqen .dg-muted{fill:var(--dg-text-muted, #6b7280)}#dg-koaqen a{cursor:pointer}#dg-koaqen .dg-edge-label-group text{fill:var(--dg-text, #1f2937)}</style><defs><marker id="dg-koaqen-m-arrow" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" stroke-width="1"/></marker><marker id="dg-koaqen-m-arrow-start" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" transfor