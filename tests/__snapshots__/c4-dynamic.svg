:12px;opacity:0.8}#dg-1o4uoov .dg-c4-rel{stroke-dasharray:6 4}#dg-1o4uoov .dg-c4-rel-label-group text{fill:var(--dg-text, #1f2937)}#dg-1o4uoov .dg-c4-rel-label-group .dg-edge-label-box{opacity:1}#dg-1o4uoov .dg-c4-label-tint{fill:var(--dg-c4-node-fill, rgba(148, 163, 184, 0.08))}#dg-1o4uoov .dg-c4-rel-label{font-size:13px}#dg-1o4uoov .dg-c4-rel-label-group .dg-c4-rel-techn,#dg-1o4uoov .dg-c4-rel-label-group .dg-c4-rel-descr{font-size:11px;fill:var(--dg-text-muted, #6b7280)}#dg-1o4uoov .dg-c4-rel-descr{font-style:italic}#dg-1o4uoov .dg-c4-index{fill:var(--dg-line, #64748b)}#dg-1o4uoov .dg-c4-rel-label-group .dg-c4-index-text{font-size:11px;font-weight:bold;fill:var(--dg-number-text, #ffffff)}#dg-1o4uoov .dg-c4-title{font-weight:bold;font-size:18px}</style><defs><marker id="dg-1o4uoov-m-arrow" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" stroke-width="1"/></marker><marker id="dg-1o4uoov-m-arrow-start" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10"><path class="dg-marker" d="M0,0 L10,5 L0,10 z" transform="translate(10,0) scale(-1,1)" stroke-width="1"/></marker></defs><g transform="translate(8,8)"><text class="dg-c4-title" text-anchor="middle" dominant-baseline="central"><tspan x="359" y="11.25" dominant-baseline="central">Dynamic diagram for Internet Banking System</tspan></text><g transform="translate(0,36.5)"><g class="dg-clusters"><g class="dg-cluster dg-c4-boundary" data-id="b"><rect class="dg-c4-boundary-box" x="0" y="270.75" width="718" height="206" rx="10"/></g></g><g class="dg-edges"><path class="dg-edge dg-c4-rel" d="M582,166.5 L582,333.25" marker-end="url(#dg-1o4uoov-m-arrow)" data-from="c1" data-to="c2"/><path class="dg-edge dg-c4-rel" d="M474,391 L244,391" marker-end="url(#dg-1o4uoov-m-arrow)" data-from="c2" data-to="c3"/><path class="dg-edge dg-c4-rel" d="M136,333.25 L136,166.5" marker-end="url(#dg-1o4uoov-m-arrow)" data-from="c3" data-to="c4"/></g><g class="dg-c4-frame-titles"><g class="dg-c4-frame-title dg-c4-boundary-title" data-id="b"><text class="dg-c4-boundary-name" text-anchor="start" dominant-baseline="central"><tspan x="12" y="287.5" dominant-baseline="central">API Application</tspan></text><text class="dg-c4-boundary-type" text-anchor="start" dominant-baseline="central"><tspan x="12" y="303.75" dominant-baseline="central">[Container]</tspan></text></g></g><g class="dg-edge-labels"><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="497.72" y="198.53" width="168.55" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="593.5" y="209.65" dominant-baseline="central">Submits credentials to</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="593.5" y="224.65" dominant-baseline="central">[JSON/HTTPS]</tspan></text><rect class="dg-c4-index" x="502.72" y="200.65" width="18" height="18" rx="9"/><text class="dg-c4-index-text" text-anchor="middle" dominant-baseline="central"><tspan x="511.72" y="209.65" dominant-baseline="central">1</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="264" y="379" width="190" height="24" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="370.5" y="391" dominant-baseline="central">Calls isAuthenticated() on</tspan></text><rect class="dg-c4-index" x="269" y="382" width="18" height="18" rx="9"/><text class="dg-c4-index-text" text-anchor="middle" dominant-baseline="central"><tspan x="278" y="391" dominant-baseline="central">2</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="41.77" y="190.4" width="188.45" height="52.25" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="147.5" y="201.53" dominant-baseline="central">select * from users where</tspan><tspan x="147.5" y="217.78" dominant-baseline="central">username = ?</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="147.5" y="232.78" dominant-baseline="central">[JDBC]</tspan></text><rect class="dg-c4-index" x="46.77" y="192.53" width="18" height="18" rx="9"/><text class="dg-c4-index-text" text-anchor="middle" dominant-baseline="central"><tspan x="55.77" y="201.53" dominant-baseline="central">3</tspan></text></g></g><g class="dg-nodes"><g class="dg-node dg-c4-element dg-c4-container dg-c4-db" data-id="c4"><path class="dg-shape" d="M28,9 A108,9 0 0,0 244,9 L244,157.5 A108,9 0 0,1 28,157.5 Z"/><path class="dg-c4-lid" d="M28,9 A108,9 0 0,1 244,9"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="38.75" dominant-baseline="central">Database</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="57" dominant-baseline="central">[Container: Relational Database</tspan><tspan x="136" y="72" dominant-baseline="central">Schema]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="95" dominant-baseline="central">Stores user registration</tspan><tspan x="136" y="110" dominant-baseline="central">information, hashed</tspan><tspan x="136" y="125" dominant-baseline="central">authentication credentials,</tspan><tspan x="136" y="140" dominant-baseline="central">access logs, etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="c1"><rect class="dg-shape" x="474" y="0" width="216" height="166.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="40.75" dominant-baseline="central">Single-Page Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="59" dominant-baseline="central">[Container: JavaScript and</tspan><tspan x="582" y="74" dominant-baseline="central">Angular]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="97" dominant-baseline="central">Provides all of the Internet</tspan><tspan x="582" y="112" dominant-baseline="central">banking functionality to</tspan><tspan x="582" y="127" dominant-baseline="central">customers via their web browser.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-component dg-c4-box" data-id="c3" data-parent="b"><rect class="dg-shape" x="28" y="333.25" width="216" height="115.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="356" dominant-baseline="central">Security Component</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="374.25" dominant-baseline="central">[Component: Spring Bean]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="397.25" dominant-baseline="central">Provides functionality Related to</tspan><tspan x="136" y="412.25" dominant-baseline="central">signing in, changing passwords,</tspan><tspan x="136" y="427.25" dominant-baseline="central">etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-component dg-c4-box" data-id="c2" data-parent="b"><rect class="dg-shape" x="474" y="333.25" width="216" height="115.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="356" dominant-baseline="central">Sign In Controller</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="374.25" dominant-baseline="central">[Component: Spring MVC Rest</tspan><tspan x="582" y="389.25" dominant-baseline="central">Controller]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="582" y="412.25" dominant-baseline="central">Allows users to sign in to the</tspan><tspan x="582" y="427.25" dominant-baseline="central">Internet Banking System.</tspan></text></g></g></g></g></svg>