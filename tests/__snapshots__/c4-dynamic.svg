* from users where</tspan><tspan x="134.13" y="757.38" dominant-baseline="central">username = ?</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central" style="fill:red"><tspan x="134.13" y="772.38" dominant-baseline="central">[JDBC]</tspan></text><rect class="dg-c4-index" x="33.4" y="732.13" width="18" height="18" rx="9"/><text class="dg-c4-index-text" text-anchor="middle" dominant-baseline="central"><tspan x="42.4" y="741.13" dominant-baseline="central">3</tspan></text></g></g><g class="dg-nodes"><g class="dg-node dg-c4-element dg-c4-container dg-c4-db" data-id="c4"><path class="dg-shape" d="M17.06,855.25 A108,9 0 0,0 233.06,855.25 L233.06,1003.75 A108,9 0 0,1 17.06,1003.75 Z"/><path class="dg-c4-lid" d="M17.06,855.25 A108,9 0 0,1 233.06,855.25"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="125.06" y="885" dominant-baseline="central">Database</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="125.06" y="903.25" dominant-baseline="central">[Container: Relational Database</tspan><tspan x="125.06" y="918.25" dominant-baseline="central">Schema]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="125.06" y="941.25" dominant-baseline="central">Stores user registration</tspan><tspan x="125.06" y="956.25" dominant-baseline="central">information, hashed</tspan><tspan x="125.06" y="971.25" dominant-baseline="central">authentication credentials,</tspan><tspan x="125.06" y="986.25" dominant-baseline="central">access logs, etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="c1"><rect class="dg-shape" x="0" y="0" width="216" height="130.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="22.75" dominant-baseline="central">Single-Page Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="41" dominant-baseline="central">[Container: JavaScript and</tspan><tspan x="108" y="56" dominant-baseline="central">Angular]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="79" dominant-baseline="central">Provides all of the Internet</tspan><tspan x="108" y="94" dominant-baseline="central">banking functionality to</tspan><tspan x="108" y="109" dominant-baseline="central">customers via their web browser.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-component dg-c4-box" data-id="c3" data-parent="b"><rect class="dg-shape" x="165" y="550.5" width="216" height="115.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="573.25" dominant-baseline="central">Security Component</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="591.5" dominant-baseline="central">[Component: Spring Bean]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="614.5" dominant-baseline="central">Provides functionality Related to</tspan><tspan x="273" y="629.5" dominant-baseline="central">signing in, changing passwords,</tspan><tspan x="273" y="644.5" dominant-baseline="central">etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-component dg-c4-box" data-id="c2" data-parent="b"><rect class="dg-shape" x="165" y="347" width="216" height="115.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="369.75" dominant-baseline="central">Sign In Controller</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="388" dominant-baseline="central">[Component: Spring MVC Rest</tspan><tspan x="273" y="403" dominant-baseline="central">Controller]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="273" y="426" dominant-baseline="central">Allows users to sign in to the</tspan><tspan x="273" y="441" dominant-baseline="central">Internet Banking System.</tspan></text></g></g></g></g></svg>