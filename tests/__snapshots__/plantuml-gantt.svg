<svg xmlns="http://www.w3.org/2000/svg" id="dg-odoyrn" class="dg dg-gantt" width="889" height="221" viewBox="0 0 889 221" role="img" aria-labelledby="dg-odoyrn-title" style="max-width:100%;height:auto"><title id="dg-odoyrn-title">Release plan</title><style>#dg-odoyrn{font-family:var(--dg-font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);font-size:14px;color:var(--dg-text, #1f2937)}#dg-odoyrn text{fill:var(--dg-text, #1f2937)}#dg-odoyrn .dg-label{fill:var(--dg-node-text, #1e1b4b)}#dg-odoyrn .dg-node .dg-shape{fill:var(--dg-node-fill, #eef2ff);stroke:var(--dg-node-stroke, #6366f1);stroke-width:1.5px}#dg-odoyrn .dg-cluster-box{fill:var(--dg-cluster-fill, #f8fafc);stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-odoyrn .dg-cluster-label{fill:var(--dg-cluster-text, #334155);font-weight:600}#dg-odoyrn .dg-cluster-title .dg-cluster-label{stroke:var(--dg-cluster-fill, #f8fafc);stroke-width:4px;stroke-linejoin:round;paint-order:stroke}#dg-odoyrn .dg-edge{fill:none;stroke:var(--dg-line, #64748b);stroke-width:1.5px}#dg-odoyrn .dg-edge-thick{stroke-width:3.5px}#dg-odoyrn .dg-edge-dotted{stroke-dasharray:3 3}#dg-odoyrn .dg-marker{fill:var(--dg-line, #64748b);stroke:var(--dg-line, #64748b)}#dg-odoyrn .dg-edge-label-box{fill:var(--dg-edge-label-fill, #ffffff);opacity:0.9}#dg-odoyrn .dg-edge-label{fill:var(--dg-text, #1f2937)}#dg-odoyrn .dg-muted{fill:var(--dg-text-muted, #6b7280)}#dg-odoyrn a{cursor:pointer}#dg-odoyrn .dg-title{fill:var(--dg-text, #1f2937);font-size:18px;font-weight:bold}#dg-odoyrn .dg-gantt-section-0{fill:var(--dg-section-fill-0, rgba(99, 102, 241, 0.06))}#dg-odoyrn .dg-gantt-section-1{fill:var(--dg-section-fill-1, rgba(100, 116, 139, 0.06))}#dg-odoyrn .dg-gantt-section-label{fill:var(--dg-text, #1f2937);font-weight:bold}#dg-odoyrn .dg-gantt-exclude{fill:var(--dg-exclude-fill, rgba(148, 163, 184, 0.18))}#dg-odoyrn .dg-gantt-grid line{stroke:var(--dg-grid, #e5e7eb);stroke-width:1px}#dg-odoyr