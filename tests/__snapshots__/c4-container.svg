dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="911.34" y="453.5" width="125.98" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="464.63" dominant-baseline="central">Uses</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="479.63" dominant-baseline="central">[async, JSON/HTTPS]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="1102.33" y="341.25" width="163.16" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="1183.91" y="352.38" dominant-baseline="central">Reads from and writes to</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="1183.91" y="367.38" dominant-baseline="central">[sync, JDBC]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="514.1" y="64" width="112.62" height="22.25" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="570.41" y="75.13" dominant-baseline="central">Sends e-mails to</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="418.22" y="166.5" width="134.06" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="485.25" y="177.63" dominant-baseline="central">Sends e-mails using</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="485.25" y="192.63" dominant-baseline="central">[sync, SMTP]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="1046.07" y="246.96" width="146.07" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="1119.11" y="258.09" dominant-baseline="central">Uses</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="1119.11" y="273.09" dominant-baseline="central">[sync/async, XML/HTTPS]</tspan></text></g></g><g class="dg-nodes"><g class="dg-node dg-c4-element dg-c4-system dg-c4-box dg-c4-external" data-id="email_system"><rect class="dg-shape" x="237.58" y="0" width="216" height="140.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="345.58" y="42.75" dominant-baseline="central">E-Mail System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="345.58" y="61" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="345.58" y="84" dominant-baseline="central">The internal Microsoft Exchange</tspan><tspan x="345.58" y="99" dominant-baseline="central">system</tspan></text></g><g class="dg-node dg-c4-element dg-c4-person dg-c4-person" data-id="customer"><rect class="dg-shape" x="656.75" y="40" width="216" height="100.5" rx="22" ry="22"/><circle class="dg-c4-head" cx="764.75" cy="21" r="21"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="764.75" y="62.75" dominant-baseline="central">Customer</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="764.75" y="81" dominant-baseline="central">[Person]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="764.75" y="104" dominant-baseline="central">A customer of the bank, with</tspan><tspan x="764.75" y="119" dominant-baseline="central">personal bank accounts</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="spa" data-parent="c1"><rect class="dg-shape" x="447.16" y="291" width="216" height="136.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="555.16" y="324.25" dominant-baseline="central">Single-Page App</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="555.16" y="342.5" dominant-baseline="central">[Container: JavaScript, Angular]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="555.16" y="365.5" dominant-baseline="central">Provides all the Internet banking</tspan><tspan x="555.16" y="380.5" dominant-baseline="central">functionality to customers via</tspan><tspan x="555.16" y="395.5" dominant-baseline="central">their web browser</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box dg-c4-external" data-id="mobile_app" data-parent="c1"><rect class="dg-shape" x="866.33" y="515.5" width="216" height="145.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="538.25" dominant-baseline="central">Mobile App</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="556.5" dominant-baseline="central">[External Container: C#,</tspan><tspan x="974.33" y="571.5" dominant-baseline="central">Xamarin]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="594.5" dominant-baseline="central">Provides a limited subset of the</tspan><tspan x="974.33" y="609.5" dominant-baseline="central">Internet banking functionality to</tspan><tspan x="974.33" y="624.5" dominant-baseline="central">customers via their mobile</tspan><tspan x="974.33" y="639.5" dominant-baseline="central">device</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="web_app" data-parent="c1"><rect class="dg-shape" x="28" y="291" width="216" height="136.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="331.75" dominant-baseline="central">Web Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="350" dominant-baseline="central">[Container: Java, Spring MVC]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="136" y="373" dominant-baseline="central">Delivers the static content and</tspan><tspan x="136" y="388" dominant-baseline="central">the Internet banking SPA</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-db" data-id="database" data-parent="c1"><path class="dg-shape" d="M1285.49,300 A108,9 0 0,0 1501.49,300 L1501.49,418.5 A108,9 0 0,1 1285.49,418.5 Z"/><path class="dg-c4-lid" d="M1285.49,300 A108,9 0 0,1 1501.49,300"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="1393.49" y="329.75" dominant-baseline="central">Database</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="1393.49" y="348" dominant-baseline="central">[Container: SQL Database]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="1393.49" y="371" dominant-baseline="central">Stores user registration</tspan><tspan x="1393.49" y="386" dominant-baseline="central">information, hashed auth</tspan><tspan x="1393.49" y="401" dominant-baseline="central">credentials, access logs, etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-db dg-c4-external" data-id="backend_api" data-parent="c1"><path class="dg-shape" d="M866.33,300 A108,9 0 0,0 1082.33,300 L1082.33,418.5 A108,9 0 0,1 866.33,418.5 Z"/><path class="dg-c4-lid" d="M866.33,300 A108,9 0 0,1 1082.33,300"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="329.75" dominant-baseline="central">API Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="348" dominant-baseline="central">[External Container: Java,</tspan><tspan x="974.33" y="363" dominant-baseline="central">Docker Container]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="974.33" y="386" dominant-baseline="central">Provides Internet banking</tspan><tspan x="974.33" y="401" dominant-baseline="central">functionality via API</tspan></text></g><g class="dg-node dg-c4-element dg-c4-system dg-c4-box dg-c4-external" data-id="banking_system"><rect class="dg-shape" x="1075.91" y="0" width="216" height="140.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="1183.91" y="26.5" dominant-baseline="central">Mainframe Banking</tspan><tspan x="1183.91" y="44" dominant-baseline="central">System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="1183.91" y="62.25" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="1183.91" y="85.25" dominant-baseline="central">Stores all of the core banking</tspan><tspan x="1183.91" y="100.25" dominant-baseline="central">information about customers,</tspan><tspan x="1183.91" y="115.25" dominant-baseline="central">accounts, transactions, etc.</tspan></text></g></g></g></g></svg>