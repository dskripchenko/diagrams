inant-baseline="central"><tspan x="530.97" y="836.88" dominant-baseline="central">Uses</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="530.97" y="851.88" dominant-baseline="central">[async, JSON/HTTPS]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="485.7" y="944" width="163.16" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="567.28" y="955.13" dominant-baseline="central">Reads from and writes to</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="567.28" y="970.13" dominant-baseline="central">[sync, JDBC]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="198.81" y="132.5" width="112.62" height="22.25" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="255.12" y="143.63" dominant-baseline="central">Sends e-mails to</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="923.96" y="467.5" width="134.06" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="990.99" y="478.63" dominant-baseline="central">Sends e-mails using</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="990.99" y="493.63" dominant-baseline="central">[sync, SMTP]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="83.98" y="1212.5" width="146.07" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="157.02" y="1223.63" dominant-baseline="central">Uses</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="157.02" y="1238.63" dominant-baseline="central">[sync/async, XML/HTTPS]</tspan></text></g></g><g class="dg-nodes"><g class="dg-node dg-c4-element dg-c4-system dg-c4-box dg-c4-external" data-id="email_system"><rect class="dg-shape" x="252.87" y="0" width="216" height="100.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="360.87" y="22.75" dominant-baseline="central">E-Mail System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="360.87" y="41" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="360.87" y="64" dominant-baseline="central">The internal Microsoft Exchange</tspan><tspan x="360.87" y="79" dominant-baseline="central">system</tspan></text></g><g class="dg-node dg-c4-element dg-c4-person dg-c4-person" data-id="customer"><rect class="dg-shape" x="94.24" y="226.75" width="216" height="100.5" rx="22" ry="22"/><circle class="dg-c4-head" cx="202.24" cy="207.75" r="21"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="202.24" y="249.5" dominant-baseline="central">Customer</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="202.24" y="267.75" dominant-baseline="central">[Person]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="202.24" y="290.75" dominant-baseline="central">A customer of the bank, with</tspan><tspan x="202.24" y="305.75" dominant-baseline="central">personal bank accounts</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="spa" data-parent="c1"><rect class="dg-shape" x="212.98" y="786" width="216" height="115.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="320.98" y="808.75" dominant-baseline="central">Single-Page App</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="320.98" y="827" dominant-baseline="central">[Container: JavaScript, Angular]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="320.98" y="850" dominant-baseline="central">Provides all the Internet banking</tspan><tspan x="320.98" y="865" dominant-baseline="central">functionality to customers via</tspan><tspan x="320.98" y="880" dominant-baseline="central">their web browser</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box dg-c4-external" data-id="mobile_app" data-parent="c1"><rect class="dg-shape" x="592.09" y="543.75" width="216" height="145.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="700.09" y="566.5" dominant-baseline="central">Mobile App</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="700.09" y="584.75" dominant-baseline="central">[External Container: C#,</tspan><tspan x="700.09" y="599.75" dominant-baseline="central">Xamarin]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="700.09" y="622.75" dominant-baseline="central">Provides a limited subset of the</tspan><tspan x="700.09" y="637.75" dominant-baseline="central">Internet banking functionality to</tspan><tspan x="700.09" y="652.75" dominant-baseline="central">customers via their mobile</tspan><tspan x="700.09" y="667.75" dominant-baseline="central">device</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-box" data-id="web_app" data-parent="c1"><rect class="dg-shape" x="316.09" y="566.25" width="216" height="100.5" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="424.09" y="589" dominant-baseline="central">Web Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="424.09" y="607.25" dominant-baseline="central">[Container: Java, Spring MVC]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="424.09" y="630.25" dominant-baseline="central">Delivers the static content and</tspan><tspan x="424.09" y="645.25" dominant-baseline="central">the Internet banking SPA</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-db" data-id="database" data-parent="c1"><path class="dg-shape" d="M632.96,784.5 A108,9 0 0,0 848.96,784.5 L848.96,903 A108,9 0 0,1 632.96,903 Z"/><path class="dg-c4-lid" d="M632.96,784.5 A108,9 0 0,1 848.96,784.5"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="740.96" y="814.25" dominant-baseline="central">Database</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="740.96" y="832.5" dominant-baseline="central">[Container: SQL Database]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="740.96" y="855.5" dominant-baseline="central">Stores user registration</tspan><tspan x="740.96" y="870.5" dominant-baseline="central">information, hashed auth</tspan><tspan x="740.96" y="885.5" dominant-baseline="central">credentials, access logs, etc.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-container dg-c4-db dg-c4-external" data-id="backend_api" data-parent="c1"><path class="dg-shape" d="M329.69,1021 A108,9 0 0,0 545.69,1021 L545.69,1139.5 A108,9 0 0,1 329.69,1139.5 Z"/><path class="dg-c4-lid" d="M329.69,1021 A108,9 0 0,1 545.69,1021"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="437.69" y="1050.75" dominant-baseline="central">API Application</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="437.69" y="1069" dominant-baseline="central">[External Container: Java,</tspan><tspan x="437.69" y="1084" dominant-baseline="central">Docker Container]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="437.69" y="1107" dominant-baseline="central">Provides Internet banking</tspan><tspan x="437.69" y="1122" dominant-baseline="central">functionality via API</tspan></text></g><g class="dg-node dg-c4-element dg-c4-system dg-c4-box dg-c4-external" data-id="banking_system"><rect class="dg-shape" x="45.94" y="1312.5" width="216" height="133" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="153.94" y="1335.25" dominant-baseline="central">Mainframe Banking</tspan><tspan x="153.94" y="1352.75" dominant-baseline="central">System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="153.94" y="1371" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="153.94" y="1394" dominant-baseline="central">Stores all of the core banking</tspan><tspan x="153.94" y="1409" dominant-baseline="central">information about customers,</tspan><tspan x="153.94" y="1424" dominant-baseline="central">accounts, transactions, etc.</tspan></text></g></g></g></g></svg>