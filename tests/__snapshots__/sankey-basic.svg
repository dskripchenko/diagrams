d: 30</title></path><path class="dg-sankey-link" d="M14,368.42 C92,368.42 92,354.42 170,354.42" style="stroke:var(--dg-pie-4, #ef4444);stroke-width:103.16px"><title>Gas → Grid: 25</title></path><path class="dg-sankey-link" d="M184,106.84 C347,106.84 347,144.42 510,144.42" style="stroke:var(--dg-pie-2, #f59e0b);stroke-width:185.68px"><title>Grid → Homes: 45</title></path><path class="dg-sankey-link" d="M184,271.89 C262,271.89 262,210 340,210" style="stroke:var(--dg-pie-2, #f59e0b);stroke-width:144.42px"><title>Grid → Industry: 35</title></path><path class="dg-sankey-link" d="M184,375.05 C347,375.05 347,282.21 510,282.21" style="stroke:var(--dg-pie-2, #f59e0b);stroke-width:61.89px"><title>Grid → Losses: 15</title></path><path class="dg-sankey-link" d="M354,158.42 C432,158.42 432,347.79 510,347.79" style="stroke:var(--dg-pie-6, #8b5cf6);stroke-width:41.26px"><title>Industry → Exports, abroad: 10</title></path></g><g class="dg-sankey-nodes"><g class="dg-sankey-node" data-id="Solar"><rect class="dg-sankey-bar" x="0" y="0" width="14" height="165.05" style="fill:var(--dg-pie-1, #6366f1)"/><text class="dg-sankey-label" text-anchor="start" dominant-baseline="central"><tspan x="20" y="82.53" dominant-baseline="central">Solar 40</tspan></text></g><g class="dg-sankey-node" data-id="Grid"><rect class="dg-sankey-bar" x="170" y="14" width="14" height="392" style="fill:var(--dg-pie-2, #f59e0b)"/><text class="dg-sankey-label" text-anchor="start" dominant-baseline="central"><tspan x="190" y="210" dominant-baseline="central">Grid 95</tspan></text></g><g class="dg-sankey-node" data-id="Wind"><rect class="dg-sankey-bar" x="0" y="179.05" width="14" height="123.79" style="fill:var(--dg-pie-3, #10b981)"/><text class="dg-sankey-label" text-anchor="start" dominant-baseline="central"><tspan x="20" y="240.95" dominant-baseline="central">Wind 30</tspan></text></g><g class="dg-sankey-node" data-id="Gas"><rect class="dg-sankey-bar" x="0" y="316.84" width="14" height="103.16" style="fill:var(--dg-