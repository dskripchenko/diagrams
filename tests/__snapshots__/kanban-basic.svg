<svg xmlns="http://www.w3.org/2000/svg" id="dg-mpxhpm" class="dg dg-kanban" width="858" height="171" viewBox="0 0 858 171" role="img" aria-labelledby="dg-mpxhpm-title" style="max-width:100%;height:auto"><title id="dg-mpxhpm-title">Kanban board</title><style>#dg-mpxhpm{font-family:var(--dg-font-family, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);font-size:14px;color:var(--dg-text, #1f2937)}#dg-mpxhpm text{fill:var(--dg-text, #1f2937)}#dg-mpxhpm .dg-label{fill:var(--dg-node-text, #1e1b4b)}#dg-mpxhpm .dg-node .dg-shape{fill:var(--dg-node-fill, #eef2ff);stroke:var(--dg-node-stroke, #6366f1);stroke-width:1.5px}#dg-mpxhpm .dg-cluster-box{fill:var(--dg-cluster-fill, #f8fafc);stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-mpxhpm .dg-cluster-label{fill:var(--dg-cluster-text, #334155);font-weight:600}#dg-mpxhpm .dg-cluster-title .dg-cluster-label{stroke:var(--dg-cluster-fill, #f8fafc);stroke-width:4px;stroke-linejoin:round;paint-order:stroke}#dg-mpxhpm .dg-edge{fill:none;stroke:var(--dg-line, #64748b);stroke-width:1.5px}#dg-mpxhpm .dg-edge-thick{stroke-width:3.5px}#dg-mpxhpm .dg-edge-dotted{stroke-dasharray:3 3}#dg-mpxhpm .dg-marker{fill:var(--dg-line, #64748b);stroke:var(--dg-line, #64748b)}#dg-mpxhpm .dg-edge-label-box{fill:var(--dg-edge-label-fill, #ffffff);opacity:0.9}#dg-mpxhpm .dg-edge-label{fill:var(--dg-text, #1f2937)}#dg-mpxhpm .dg-muted{fill:var(--dg-text-muted, #6b7280)}#dg-mpxhpm a{cursor:pointer}#dg-mpxhpm .dg-kanban-lane{fill:var(--dg-cluster-fill, #f8fafc);stroke:var(--dg-cluster-stroke, #cbd5e1);stroke-width:1px}#dg-mpxhpm .dg-kanban-title{fill:var(--dg-cluster-text, #334155);font-weight:bold}#dg-mpxhpm .dg-kanban-card{fill:var(--dg-row-fill, #ffffff);stroke:var(--dg-node-stroke, #6366f1);stroke-width:1px}#dg-mpxhpm .dg-kanban-text{fill:var(--dg-text, #1f2937)}#dg-mpxhpm .dg-kanban-meta{fill:var(--dg-text-muted, #6b7280);font-size:12px}#dg-mpxhpm .dg-kanban-very-high{fill:var(--dg-task-crit-s