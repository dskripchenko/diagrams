anchor="middle" dominant-baseline="central"><tspan x="986.38" y="288.63" dominant-baseline="central">[Telephone]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="720.69" y="121.5" width="127.17" height="36" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="784.28" y="132.63" dominant-baseline="central">Sends e-mail using</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="784.28" y="147.63" dominant-baseline="central">[SMTP]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="1128.37" y="105.25" width="176.19" height="68.5" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="1216.47" y="116.38" dominant-baseline="central">Gets account information</tspan><tspan x="1216.47" y="132.63" dominant-baseline="central">from, and makes payments</tspan><tspan x="1216.47" y="148.88" dominant-baseline="central">using</tspan></text><text class="dg-c4-rel-techn" text-anchor="middle" dominant-baseline="central"><tspan x="1216.47" y="163.88" dominant-baseline="central">[XML/HTTPS]</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="281.78" y="99.13" width="112.62" height="22.25" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="338.09" y="110.25" dominant-baseline="central">Sends e-mails to</tspan></text></g><g class="dg-edge-label-group dg-c4-rel-label-group"><rect class="dg-edge-label-box" x="1595.53" y="128.38" width="41.39" height="22.25" rx="3"/><text class="dg-edge-label dg-c4-rel-label" text-anchor="middle" dominant-baseline="central"><tspan x="1616.23" y="139.5" dominant-baseline="central">Uses</tspan></text></g></g><g class="dg-nodes"><g class="dg-node dg-c4-element dg-c4-person dg-c4-person" data-id="customer"><rect class="dg-shape" x="0" y="40" width="216" height="118" rx="22" ry="22"/><circle class="dg-c4-head" cx="108" cy="21" r="21"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="62.75" dominant-baseline="central">Personal Banking</tspan><tspan x="108" y="80.25" dominant-baseline="central">Customer</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="98.5" dominant-baseline="central">[Person]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="108" y="121.5" dominant-baseline="central">A customer of the bank, with</tspan><tspan x="108" y="136.5" dominant-baseline="central">personal bank accounts.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-person dg-c4-person" data-id="staff" data-parent="bank"><rect class="dg-shape" x="1756.75" y="102.5" width="216" height="114" rx="22" ry="22"/><circle class="dg-c4-head" cx="1864.75" cy="83.5" r="21"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="1864.75" y="132" dominant-baseline="central">Customer Service Staff</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="1864.75" y="150.25" dominant-baseline="central">[Person]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="1864.75" y="173.25" dominant-baseline="central">Customer service staff within the</tspan><tspan x="1864.75" y="188.25" dominant-baseline="central">bank.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-system dg-c4-box" data-id="banking" data-parent="bank"><rect class="dg-shape" x="892.37" y="62.5" width="216" height="154" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="1000.37" y="104.5" dominant-baseline="central">Internet Banking System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="1000.37" y="122.75" dominant-baseline="central">[Software System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="1000.37" y="145.75" dominant-baseline="central">Allows customers to view</tspan><tspan x="1000.37" y="160.75" dominant-baseline="central">information about their bank</tspan><tspan x="1000.37" y="175.75" dominant-baseline="central">accounts, and make payments.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-system dg-c4-box dg-c4-external" data-id="mail" data-parent="bank"><rect class="dg-shape" x="460.19" y="62.5" width="216" height="154" rx="10" ry="10"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="568.19" y="112" dominant-baseline="central">E-mail System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="568.19" y="130.25" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="568.19" y="153.25" dominant-baseline="central">The internal Microsoft Exchange</tspan><tspan x="568.19" y="168.25" dominant-baseline="central">e-mail system.</tspan></text></g><g class="dg-node dg-c4-element dg-c4-system dg-c4-db dg-c4-external" data-id="mainframe" data-parent="bank"><path class="dg-shape" d="M1324.56,71.5 A108,9 0 0,0 1540.56,71.5 L1540.56,207.5 A108,9 0 0,1 1324.56,207.5 Z"/><path class="dg-c4-lid" d="M1324.56,71.5 A108,9 0 0,1 1540.56,71.5"/><text class="dg-c4-name" text-anchor="middle" dominant-baseline="central"><tspan x="1432.56" y="101.25" dominant-baseline="central">Mainframe Banking</tspan><tspan x="1432.56" y="118.75" dominant-baseline="central">System</tspan></text><text class="dg-c4-type" text-anchor="middle" dominant-baseline="central"><tspan x="1432.56" y="137" dominant-baseline="central">[External System]</tspan></text><text class="dg-c4-descr" text-anchor="middle" dominant-baseline="central"><tspan x="1432.56" y="160" dominant-baseline="central">Stores all of the core banking</tspan><tspan x="1432.56" y="175" dominant-baseline="central">information about customers,</tspan><tspan x="1432.56" y="190" dominant-baseline="central">accounts, transactions, etc.</tspan></text></g></g></g></g></svg>